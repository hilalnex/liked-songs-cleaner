<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liked Songs Cleaner</title>
</head>
<body>
  <h1>Spotify Beğenilen Şarkılar</h1>
  <p>Beğendiğin şarkıları yönetmek için Spotify'a bağlan.</p>
<button id="login">Spotify'a Bağlan</button>

  <script>
    const CLIENT_ID = "fdbc382aeb0f480785ae662cbac3ddd8";
    const REDIRECT_URI = "https://hilalnex.github.io/liked-songs-cleaner/";

    const SCOPES = "user-library-read user-library-modify";

    document.getElementById("login").addEventListener("click", () => {
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES
      });

      window.location.href =
        "https://accounts.spotify.com/authorize?" + params.toString();
    });
  </script>
</body>
</html>
