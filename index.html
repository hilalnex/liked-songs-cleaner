<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liked Songs Cleaner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    #status {
      margin: 20px 0;
      white-space: pre-line;
    }

    #clear {
      display: none;
    }
  </style>
</head>

<body>
  <h1>Spotify Beğenilen Şarkılar</h1>

  <p id="status">Spotify hesabına bağlan.</p>

  <button id="login">Spotify'a Bağlan</button>
  <button id="clear">Beğenilen Şarkıları Temizle</button>

  <script>
    const CLIENT_ID = "fdbc382aeb0f480785ae662cbac3ddd8";
    const REDIRECT_URI =
      "https://hilalnex.github.io/liked-songs-cleaner/";

    const SCOPES =
      "user-library-read user-library-modify";

    const status = document.getElementById("status");
    const loginButton = document.getElementById("login");
    const clearButton = document.getElementById("clear");

    function randomString(length) {
      const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

      let result = "";

      const values = new Uint8Array(length);
      crypto.getRandomValues(values);

      for (let i = 0; i < length; i++) {
        result += characters[values[i] % characters.length];
      }

      return result;
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();

      const data = encoder.encode(plain);

      return await crypto.subtle.digest("SHA-256", data);
    }

    function base64urlEncode(input) {
      return btoa(
        String.fromCharCode(...new Uint8Array(input))
      )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    async function createCodeChallenge(verifier) {
      const hashed = await sha256(verifier);

      return base64urlEncode(hashed);
    }

    async function login() {
      const verifier = randomString(64);

      const challenge =
        await createCodeChallenge(verifier);

      localStorage.setItem("code_verifier", verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge
      });

      window.location.href =
        "https://accounts.spotify.com/authorize?" +
        params.toString();
    }

    async function getToken(code) {
      const verifier =
        localStorage.getItem("code_verifier");

      const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const response = await fetch(
        "https://accounts.spotify.com/api/token",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          },
          body: body
        }
      );

      if (!response.ok) {
        throw new Error("Spotify token alınamadı.");
      }

      return await response.json();
    }

    async function handleCallback() {
      const params =
        new URLSearchParams(window.location.search);

      const code = params.get("code");
      const error = params.get("error");

      if (error) {
        status.textContent =
          "Spotify bağlantısı reddedildi: " + error;
        return;
      }

      if (!code) {
        return;
      }

      try {
        status.textContent =
          "Spotify bağlantısı kuruluyor...";

        const tokenData = await getToken(code);

        localStorage.setItem(
          "access_token",
          tokenData.access_token
        );

        localStorage.setItem(
          "expires_at",
          Date.now() + tokenData.expires_in * 1000
        );

        window.history.replaceState(
          {},
          document.title,
          REDIRECT_URI
        );

        loginButton.style.display = "none";
        clearButton.style.display = "inline-block";

        status.textContent =
          "Spotify hesabın bağlandı.";
      } catch (error) {
        status.textContent =
          "Hata: " + error.message;
      }
    }

    async function clearLikedSongs() {
      const token =
        localStorage.getItem("access_token");

      if (!token) {
        status.textContent =
          "Önce Spotify'a bağlan.";
        return;
      }

      if (
        !confirm(
          "Beğenilen Şarkılarındaki tüm şarkılar kaldırılacak. Devam edilsin mi?"
        )
      ) {
        return;
      }

      try {
        status.textContent =
          "Beğenilen şarkılar alınıyor...";

        let offset = 0;
        let allUris = [];

        while (true) {
          const response = await fetch(
            "https://api.spotify.com/v1/me/tracks?limit=50&offset=" +
              offset,
            {
              headers: {
                Authorization: "Bearer " + token
              }
            }
          );

          if (!response.ok) {
            throw new Error(
              "Beğenilen şarkılar alınamadı."
            );
          }

          const data = await response.json();

          for (const item of data.items) {
            if (item.track && item.track.uri) {
              allUris.push(item.track.uri);
            }
          }

          if (
            data.items.length === 0 ||
            !data.next
          ) {
            break;
          }

          offset += data.items.length;
        }

        if (allUris.length === 0) {
          status.textContent =
            "Beğenilen Şarkılar zaten boş.";
          return;
        }

        status.textContent =
          allUris.length +
          " şarkı bulundu. Temizleniyor...";

        for (
          let i = 0;
          i < allUris.length;
          i += 40
        ) {
          const batch =
            allUris.slice(i, i + 40);

          const response = await fetch(
            "https://api.spotify.com/v1/me/library?uris=" +
              encodeURIComponent(batch.join(",")),
            {
              method: "DELETE",
              headers: {
                Authorization: "Bearer " + token
              }
            }
          );

          if (!response.ok) {
            throw new Error(
              "Şarkılar kaldırılırken hata oluştu."
            );
          }

          status.textContent =
            "Temizleniyor... " +
            Math.min(
              i + batch.length,
              allUris.length
            ) +
            " / " +
            allUris.length;
        }

        status.textContent =
          "Tamamlandı. " +
          allUris.length +
          " şarkı Beğenilen Şarkılar'dan kaldırıldı.";

      } catch (error) {
        status.textContent =
          "Hata: " + error.message;
      }
    }

    loginButton.addEventListener(
      "click",
      login
    );

    clearButton.addEventListener(
      "click",
      clearLikedSongs
    );

    handleCallback();
  </script>
</body>
</html>
